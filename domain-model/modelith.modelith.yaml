# yaml-language-server: $schema=https://modelith.sh/schema/domain-model/v1.json
kind: DomainModel
version: v1
title: Modelith
description: >-
  Tooling for authoring domain models by conversation. An `Author` describes
  concepts in plain language to a `Skill`, which drafts the `Model` YAML. The
  `Linter` validates it against a `Schema`; the `Renderer` produces a
  `Document` committed alongside it. A `GitHubAction` enforces both in CI.
  A `Model` can `Import` vocabulary from other repos, pinned to a ref with
  provenance. The `Example` golden fixture pins the renderer's output;
  `ADR`s record the decisions that shaped the tool.

glossary:
  Author: >-
    A human or agent who creates and edits a `Model` by conversation. Not
    modeled as an entity.
  Contributor: >-
    A human or agent working on modelith itself. Not modeled as an entity.

enums:
  HostKind:
    description: The remote platform an `Import`'s `Source` points to.
    values:
      - name: GitHub
        definition: A github.com repository; transport delegates to `gh api`.
      - name: ADO
        definition: An Azure DevOps (dev.azure.com) repository; transport delegates to `az rest`.

  FindingSeverity:
    description: The classification of a `LintFinding` — how seriously it blocks a build.
    values:
      - name: error
        definition: >-
          Must fix; the model is structurally or semantically invalid, and the
          lint run exits non-zero.
      - name: warning
        definition: >-
          Does not block on its own — either a likely bug (e.g. a dangling
          reference or ambiguous name) or an advisory completeness gap. Gaps
          are warning-severity findings in the completeness layer; they
          block only under `--completeness error`.

  LintLayer:
    description: The three ordered stages of a lint run.
    values:
      - name: structural
        definition: JSON Schema conformance; errors here block later stages.
      - name: semantic
        definition: Relationship targets exist, invariant ids resolve, backtick terms are defined.
      - name: completeness
        definition: >-
          Advisory gaps — every `Entity` has `Invariant`s, every `Entity` is
          touched by a `Scenario`, and defined `GlossaryTerm`s and `Enum`s are
          referenced. Findings carry `warning` severity and block only under
          `--completeness error`.

  RendererBackend:
    description: >-
      The artifacts the `Renderer` produces — the Markdown `Document` and the
      Mermaid diagram embedded in it.
    values:
      - name: markdown
        definition: >-
          A `Document` file (`*.modelith.md`) — the renderer's only top-level
          output, and the committed form readers consume.
      - name: mermaid
        definition: >-
          The `erDiagram` block embedded in a Markdown `Document`, rendered by
          `internal/render/mermaid`. Never emitted standalone.

  SkillName:
    description: The three skills shipped in the Claude Code plugin.
    values:
      - name: author
        definition: domain-model-author — drives the conversation that produces a `Model`.
      - name: lint
        definition: domain-model-lint — runs the linter and interprets findings for the user.
      - name: context
        definition: domain-model-context — loads a model as context before a coding task.

entities:
  # ── Core artifact ────────────────────────────────────────────────

  Model:
    definition: >-
      A `*.modelith.yaml` file — the canonical, plain-language source of truth
      for a domain. It declares `Entity`s, `Enum`s, `Scenario`s, and
      `GlossaryTerm`s, plus model-level `Invariant`s. A `Model` may `Import`
      other `Model`s to share vocabulary across repos.
    relationships:
      - entity: Entity
        cardinality: 1:n
        ownership: owned
      - entity: Enum
        cardinality: 1:n
        ownership: owned
      - entity: Scenario
        cardinality: 1:n
        ownership: owned
      - entity: GlossaryTerm
        cardinality: 1:n
        ownership: owned
      - entity: Import
        cardinality: 1:n
        ownership: referenced
    attributes:
      - name: kind
        type: string
        description: Always `DomainModel`; the file-type discriminator.
      - name: version
        type: string
        description: The `Schema` version this model conforms to (e.g. `v1`).
      - name: title
        type: string
        description: Human-facing name of the model.
      - name: entityCount
        type: integer
        derived: true
        derivation: The number of `Entity`s declared in this `Model`.
    actions:
      - name: lint
        actor: Author
        preserves: [model-has-version, linter-three-layers]
        description: Run the `Linter` against this `Model` and surface every `LintFinding`.
      - name: render
        actor: Author
        preserves: [renderer-output-matches-model, lint-before-render]
        description: Produce a `Document` from this `Model` via the `Renderer`.
      - name: import
        actor: Author
        preserves: [import-pinned-to-ref, import-has-provenance, fetch-timeout-bounded]
        description: Fetch and vendor a remote `Model` from a `Source`.
    invariants:
      - id: model-has-version
        statement: Every `Model` declares a `version` matching a known `Schema` version.
      - id: model-has-at-least-one-entity
        statement: A `Model` has at least one `Entity` — an empty model describes nothing.

  # ── Format concepts (what goes inside a Model) ───────────────────

  Entity:
    definition: >-
      A named concept within a `Model`. It carries a prose `definition`, typed
      `Attribute`s, `Relationship`s to other `Entity`s, `Action`s that may be
      performed on it, and `Invariant`s that must always hold.
    relationships:
      - entity: Attribute
        cardinality: 1:n
        ownership: owned
      - entity: Relationship
        cardinality: 1:n
        ownership: owned
      - entity: Action
        cardinality: 1:n
        ownership: owned
      - entity: Invariant
        cardinality: 1:n
        ownership: owned
        note: Entity-scoped invariants; cross-entity rules live on the `Model`.
    attributes:
      - name: name
        type: string
        description: Canonical PascalCase identifier (e.g. `ParkingSpot`, not `parking_spot`).
    invariants:
      - id: entity-name-pascal-case
        statement: >-
          An `Entity` name is PascalCase, at least two characters, with no
          underscores or hyphens.
      - id: entity-has-definition
        statement: Every `Entity` has a non-empty `definition`.

  Attribute:
    definition: >-
      A typed property of an `Entity`. Its type is a primitive (`string`,
      `integer`, `boolean`, `timestamp`), a defined `Enum`, or a cross-model
      reference (`scope.Name`). An `Attribute` may be `derived` — computed from
      other state rather than stored.
    relationships:
      - entity: Enum
        cardinality: n:1
        ownership: referenced
        note: Set when the attribute's type is a defined `Enum`.
    attributes:
      - name: name
        type: string
        description: The property name in the owning `Entity`.
      - name: type
        type: string
        description: >-
          A primitive (`string`, `integer`, `boolean`, `timestamp`), a defined
          `Enum` name, or a cross-model reference (`payments.PaymentMethod`).
      - name: derived
        type: boolean
        description: True when the value is computed from other state rather than stored.
      - name: derivation
        type: string
        description: Prose explanation of how the value is computed; required when `derived` is true.
    invariants:
      - id: attribute-type-resolves
        statement: >-
          An `Attribute`'s type is a lowercase primitive, the PascalCase name
          of a defined `Enum`, or a well-formed `scope.Name` cross-model
          reference.
      - id: attribute-derived-needs-derivation
        statement: >-
          An `Attribute` marked `derived` must provide a `derivation`
          explaining how the value is computed.

  Relationship:
    definition: >-
      A directed connection between two `Entity`s, declared from the parent.
      It carries a `cardinality` (`1:1`, `1:n`, `n:1`, `n:n`), an optional
      `ownership` (`owned` or `referenced`), an optional short `role` label,
      and an optional `note` for detail.
    relationships:
      - entity: Entity
        cardinality: n:1
        ownership: referenced
        role: target
        note: The `Entity` this relationship points to.
    attributes:
      - name: cardinality
        type: string
        description: Exactly one of `1:1`, `1:n`, `n:1`, or `n:n`.
      - name: ownership
        type: string
        description: >-
          `owned` when the target `Entity` is part of this one and cannot exist
          independently; `referenced` when the target is independent.
      - name: role
        type: string
        description: A short label drawn on the diagram line, e.g. `Owner`.
      - name: note
        type: string
        description: Prose detail that doesn't fit in a short `role` label.
    invariants:
      - id: relationship-cardinality-exact
        statement: >-
          A `Relationship`'s cardinality is exactly one of `1:1`, `1:n`, `n:1`,
          or `n:n`.
      - id: relationship-target-exists
        statement: >-
          A `Relationship`'s target `Entity` must be declared in the same
          `Model`.
      - id: relationship-not-both-owned
        statement: >-
          A reciprocal `Relationship` pair cannot have both ends claiming
          `ownership: owned` — at most one end owns the relationship.

  Invariant:
    definition: >-
      A rule that must always hold, identified by a unique `id` and a prose
      `statement`. Scoped to an `Entity` (entity-level) or to the `Model`
      (model-level, for cross-entity rules). Referenced by `Scenario` steps
      and `Action` `preserves` lists.
    relationships:
      - entity: Entity
        cardinality: n:1
        ownership: referenced
        note: Set when entity-scoped; absent for model-level invariants.
      - entity: Model
        cardinality: n:1
        ownership: referenced
        note: Set when model-scoped; absent for entity-level invariants.
    attributes:
      - name: id
        type: string
        description: >-
          Unique lowercase-kebab-case identifier across the entire model
          (e.g. `at-least-one-owner`).
      - name: statement
        type: string
        description: The rule stated in prose, with entities backticked.
    invariants:
      - id: invariant-id-unique
        statement: >-
          An `Invariant`'s id is unique across the entire `Model` — entity-level
          and model-level invariants share one namespace.
      - id: invariant-id-kebab-case
        statement: An `Invariant`'s id is lowercase kebab-case.

  Action:
    definition: >-
      An operation that may be performed on an `Entity`. Declares the `actor`
      (a `GlossaryTerm` role or another `Entity`), which `Invariant`s it
      `preserves`, and a prose `description`.
    relationships:
      - entity: GlossaryTerm
        cardinality: n:1
        ownership: referenced
        note: The actor role, when the actor is a glossary term rather than an entity.
    attributes:
      - name: name
        type: string
        description: The operation name (e.g. `archive`, `enter-with-keycard`).
      - name: actor
        type: string
        description: The `GlossaryTerm` role or `Entity` that performs this action.
      - name: preserves
        type: string
        description: List of `Invariant` ids this action must not violate.
      - name: description
        type: string
        description: Prose explanation of what the action does.
    invariants:
      - id: action-actor-resolves
        statement: >-
          An `Action`'s actor is a declared `Entity` or `GlossaryTerm` — an
          undefined actor warns.
      - id: action-preserves-resolves
        statement: >-
          Every `Invariant` id in an `Action`'s preserves list resolves to a
          declared `Invariant` — a dangling id is an error.

  Enum:
    definition: >-
      A value type defined at the `Model` level. Each `Enum` has a
      `description` and a list of named `values`, each with a `name` and
      `definition`. Referenced by `Attribute` `type`.
    relationships:
      - entity: Model
        cardinality: n:1
        ownership: referenced
    attributes:
      - name: name
        type: string
        description: The PascalCase name used as an `Attribute` `type` (e.g. `ProjectStatus`).
      - name: description
        type: string
        description: What the enum represents and where it applies.
    invariants:
      - id: enum-has-values
        statement: An `Enum` declares at least one value.
      - id: enum-value-has-name-and-definition
        statement: >-
          Every value in an `Enum` has both a `name` and a `definition`.

  Scenario:
    definition: >-
      A short narrative that stress-tests the `Model` by walking through a
      sequence of `steps` with named `actors`. Each `Scenario` declares which
      `Invariant`s it touches, so the linter can flag gaps.
    relationships:
      - entity: Model
        cardinality: n:1
        ownership: referenced
    attributes:
      - name: name
        type: string
        description: Short human-facing title (e.g. "Monthly parker uses a reserved spot").
      - name: actors
        type: string
        description: The `Entity`s and `GlossaryTerm`s that participate in this scenario.
      - name: invariants_touched
        type: string
        description: The `Invariant` ids this scenario exercises.
    invariants:
      - id: scenario-has-steps
        statement: A `Scenario` has at least one step.
      - id: scenario-invariants-resolve
        statement: >-
          Every `Invariant` id in a `Scenario`'s invariants_touched resolves to
          a declared `Invariant` — a dangling id is an error.

  GlossaryTerm:
    definition: >-
      A non-entity vocabulary term — a role, an actor, or a domain noun —
      defined at the `Model` level with a prose `definition`. Referenced by
      `Action` `actor` and `Scenario` `actors`.
    relationships:
      - entity: Model
        cardinality: n:1
        ownership: referenced
    attributes:
      - name: name
        type: string
        description: The term being defined (e.g. `Owner`, `Member`).
      - name: definition
        type: string
        description: Prose definition of what the term means in this domain.
    invariants:
      - id: glossary-term-has-definition
        statement: A `GlossaryTerm` has a non-empty `definition`.

  # ── Engine (what processes a Model) ──────────────────────────────

  Schema:
    definition: >-
      A versioned JSON Schema that defines the valid structure of a `Model`.
      The schema is the source of truth for the format; Go structs in
      `internal/model` are kept property-for-property in sync with it by
      TestSchemaStructSync. Each `Schema` version is a directory under
      `internal/schema/`.
    relationships:
      - entity: Model
        cardinality: 1:n
        ownership: referenced
        note: A `Schema` validates every `Model` that declares its version.
    attributes:
      - name: version
        type: string
        description: The version label (e.g. `v1`) — matches the directory name under `internal/schema/`.
      - name: path
        type: string
        description: The directory holding the schema, e.g. `internal/schema/v1/`.
    invariants:
      - id: schema-struct-sync
        statement: >-
          Every property in the `Schema` has a matching Go struct field and vice
          versa, enforced by TestSchemaStructSync.
      - id: schema-version-immutable
        statement: >-
          A shipped `Schema` version is never mutated; format evolution adds a
          new version directory.

  Linter:
    definition: >-
      The validation engine that checks a `Model`. Operates in three layers:
      structural (JSON Schema conformance), semantic (relationship targets
      exist, invariant ids resolve), and completeness (every `Entity` has
      `Invariant`s, every `Entity` is touched by a `Scenario`).
    relationships:
      - entity: Schema
        cardinality: n:1
        ownership: referenced
        note: The `Schema` the `Linter` validates against.
      - entity: Model
        cardinality: 1:n
        ownership: referenced
        note: The `Model`s the `Linter` checks.
      - entity: LintFinding
        cardinality: 1:n
        ownership: owned
    attributes:
      - name: strictMode
        type: boolean
        description: >-
          When set (`--completeness error`), completeness gaps are promoted to
          blocking errors.
      - name: errorCount
        type: integer
        derived: true
        derivation: The number of `LintFinding`s with `severity` = `error` from the most recent run.
    actions:
      - name: run
        actor: Author
        preserves: [linter-three-layers, linter-exit-code]
        description: >-
          Execute all three layers against a `Model` and produce `LintFinding`s.
    invariants:
      - id: linter-three-layers
        statement: >-
          Every lint run applies all three layers — structural, semantic, and
          completeness — in that order. Structural errors block semantic checks.
      - id: linter-exit-code
        statement: >-
          The `Linter` exits non-zero when there are errors; warnings and gaps
          do not affect the exit code unless `--completeness error` is set.

  LintFinding:
    definition: >-
      One issue discovered during a lint run. A finding is an error (must fix),
      a warning (likely a bug), or a completeness gap (advisory). Each finding
      points to the specific part of the `Model` it concerns.
    relationships:
      - entity: Linter
        cardinality: n:1
        ownership: referenced
    attributes:
      - name: severity
        type: FindingSeverity
        description: >-
          Whether this finding blocks — `error` always blocks; `warning`
          (including completeness gaps) blocks only under
          `--completeness error`.
      - name: layer
        type: LintLayer
        description: Which lint stage produced this finding.
      - name: path
        type: string
        description: JSON Pointer to the part of the `Model` this finding concerns.
      - name: message
        type: string
        description: Human-readable description of what is wrong and how to fix it.
    invariants:
      - id: finding-has-severity
        statement: Every `LintFinding` has exactly one `severity`.

  Renderer:
    definition: >-
      Produces a rendered `Document` from a `Model`. The output is a Markdown
      file with an embedded Mermaid `erDiagram`, supplied by
      `internal/render/mermaid`. CI uses `render --check` to fail on drift.
    relationships:
      - entity: Model
        cardinality: 1:n
        ownership: referenced
        note: The `Model`s the `Renderer` produces output for.
      - entity: Document
        cardinality: 1:n
        ownership: owned
    attributes:
      - name: backend
        type: RendererBackend
        description: >-
          The artifact produced — the Markdown `Document`, with the Mermaid
          `erDiagram` embedded in it.
    actions:
      - name: render
        actor: Author
        preserves: [renderer-output-matches-model]
        description: Generate a `Document` from a `Model` and write it to disk.
      - name: check
        actor: Contributor
        preserves: [document-never-hand-edited]
        description: >-
          Regenerate the `Document` and compare it to the committed copy;
          fail if they differ.
    invariants:
      - id: renderer-output-matches-model
        statement: >-
          A `Document` produced by the `Renderer` reflects the current state of
          the `Model` — every `Entity`, `Invariant`, and `Scenario` is present.

  Document:
    definition: >-
      The rendered Markdown file (`*.modelith.md`) committed alongside the
      `Model`. Generated by the `Renderer`; never edited by hand. Contains
      the model's definitions, invariants, scenarios, and an embedded Mermaid
      `erDiagram`.
    relationships:
      - entity: Model
        cardinality: n:1
        ownership: referenced
        note: The `Model` this `Document` was generated from.
    attributes:
      - name: path
        type: string
        description: >-
          The file path, derived from the `Model`'s path by replacing
          `.modelith.yaml` with `.modelith.md`.
    invariants:
      - id: document-never-hand-edited
        statement: >-
          A `Document` is generated exclusively by the `Renderer`; hand edits
          are detected by `render --check` and rejected in CI.
      - id: document-committed-with-model
        statement: >-
          A `Document` is committed to the same repository as its `Model`, so
          readers see the rendered form without running any tool.

  # ── Dependencies (vendored models from other repos) ──────────────

  Import:
    definition: >-
      A vendored copy of a remote `Model`, fetched from a `Source` (GitHub or
      Azure DevOps URL pinned to a ref). `deps import` writes it into the
      directory you pass (the working directory by default), named by the
      origin's filename, and stamps provenance headers recording origin, ref,
      and digest. Re-running the fetch replaces an existing copy — that is the
      refresh workflow.
    relationships:
      - entity: Source
        cardinality: n:1
        ownership: referenced
        note: The remote origin this `Import` was fetched from.
      - entity: Model
        cardinality: n:1
        ownership: referenced
        note: The local `Model` that declares this import.
    attributes:
      - name: vendoredPath
        type: string
        description: >-
          Where the vendored file lives — the directory passed to `deps import`
          (default: the working directory) plus the origin's filename, e.g.
          `docs/payments.modelith.yaml`.
      - name: digest
        type: string
        description: Content hash recorded at fetch time for integrity verification.
    actions:
      - name: fetch
        actor: Author
        preserves: [import-pinned-to-ref, import-has-provenance, source-host-unambiguous, fetch-timeout-bounded]
        description: >-
          Fetch the remote `Model` from the `Source` through the delegated CLI
          (`gh` for GitHub, `az` for ADO), write it into the target directory
          (default: the working directory), and stamp provenance headers. Each
          delegated command is bounded by `--timeout` (default 60s); re-running
          fetch replaces an existing copy.
    invariants:
      - id: fetch-timeout-bounded
        statement: >-
          Every delegated fetch (`gh` for GitHub, `az` for ADO) is bounded by a
          per-command `--timeout` (default 60s) — a hung CLI fails fast instead
          of stalling the import.
      - id: import-pinned-to-ref
        statement: >-
          An `Import` is always pinned to a specific ref (branch, tag, or
          commit) — it never tracks a moving target like `main`.
      - id: import-has-provenance
        statement: >-
          Every vendored `Import` carries provenance headers recording the
          `Source` URL, the pinned ref, and a content digest for integrity
          verification.

  Source:
    definition: >-
      A remote origin for an `Import`: a GitHub or Azure DevOps URL pinned to
      a ref (branch, tag, or commit). The `Source` carries a host discriminator
      (HostGitHub or HostADO) so the transport layer can delegate to the
      right CLI (`gh api` or `az rest`). For ADO sources, Project names the
      Azure DevOps project and RefType records how the version parameter was
      prefixed (GB/GT/GC), so the API call uses the right version descriptor.
    relationships:
      - entity: Import
        cardinality: 1:n
        ownership: referenced
    attributes:
      - name: host
        type: HostKind
        description: Which remote platform this source points to.
      - name: origin
        type: string
        description: >-
          The base repository URL — `https://github.com/<owner>/<repo>` or
          `https://dev.azure.com/<org>/<project>/_git/<repo>`. The file path
          and pinned ref are tracked by separate attributes.
      - name: ref
        type: string
        description: The pinned ref (branch, tag, or commit) the source is locked to.
      - name: project
        type: string
        description: >-
          The Azure DevOps project name, extracted from the URL path
          (`/org/project/_git/repo`). Empty for GitHub sources.
      - name: refType
        type: string
        description: >-
          The ADO version-type prefix parsed from the URL: `branch` (GB),
          `tag` (GT), or `commit` (GC). Empty for GitHub sources and when
          `--ref` overrides the URL's ref — the transport layer auto-detects.
    invariants:
      - id: source-host-unambiguous
        statement: >-
          Every `Source` has exactly one `host` — GitHub or ADO, never both and
          never neither. The host determines which CLI the transport layer uses.
      - id: source-ref-override-clears-ref-type
        statement: >-
          When a `Source`'s ref is set by `--ref` rather than parsed from the
          URL, RefType is empty — the transport layer auto-detects the ref
          type rather than trusting the URL prefix that was overridden.

  # ── Ecosystem (how you use the tool) ─────────────────────────────

  Skill:
    definition: >-
      A Claude Code plugin skill that drives the authoring workflow. The three
      skills — author, lint, context — are the primary interface to modelith;
      they shell out to the `modelith` binary, which must be installed
      separately.
    relationships:
      - entity: Model
        cardinality: 1:n
        ownership: referenced
        note: The `Model`s the `Skill` authors, lints, or loads as context.
      - entity: Linter
        cardinality: n:1
        ownership: referenced
        note: The `Linter` the `Skill` shells out to.
      - entity: Renderer
        cardinality: n:1
        ownership: referenced
        note: The `Renderer` the `Skill` shells out to.
    attributes:
      - name: name
        type: SkillName
        description: Which of the three skills this is.
    invariants:
      - id: skill-shells-to-cli
        statement: >-
          A `Skill` shells out to the `modelith` binary — it is not a library
          and does not embed the engine. The binary must be installed
          separately.

  GitHubAction:
    definition: >-
      The GitHub Action (`action.yml`) that runs `modelith lint` and
      `modelith render --check` in CI. It downloads a specific pinned release
      of the CLI rather than building from source.
    relationships:
      - entity: Linter
        cardinality: n:1
        ownership: referenced
        note: The `Linter` the `GitHubAction` invokes.
      - entity: Renderer
        cardinality: n:1
        ownership: referenced
        note: The `Renderer` the `GitHubAction` invokes with `--check`.
    attributes:
      - name: version
        type: string
        description: The pinned release tag the action downloads (e.g. `v0.1.0`).
    invariants:
      - id: action-version-pinned
        statement: >-
          The `GitHubAction` downloads a specific pinned release — it does not
          build from source. After a release, `action.yml`'s default version
          must be bumped.

  Example:
    definition: >-
      The golden test fixtures — `examples/example.modelith.yaml` and the
      worked examples under `docs/05-parking-garage/`, each with its committed
      `.md`. All must lint clean under strict mode (`task lint-models`) and
      their `.md` must match the renderer's output exactly (`task render-check`,
      TestGoldenExample). Changes to the renderer or an example require
      regenerating the `.md`.
    relationships:
      - entity: Model
        cardinality: n:1
        ownership: referenced
        note: The `Example` is a `Model` with special constraints.
      - entity: Document
        cardinality: 1:1
        ownership: owned
        note: The committed `.md` is a golden fixture compared by TestGoldenExample.
    invariants:
      - id: example-lints-clean
        statement: >-
          The `Example` must lint clean under `task lint-models` — strict mode,
          where completeness gaps are errors.
      - id: example-md-is-golden
        statement: >-
          The `Example`'s `.md` is a golden fixture — it must match the
          `Renderer`'s output exactly, enforced by TestGoldenExample and
          `task render-check`.

  ADR:
    definition: >-
      A forward-looking architecture decision record in `project-docs/adr/`.
      Records a hard-to-reverse call with real trade-offs, so intentions stay
      current. Retrospective records go in `project-docs/audits/` instead.
    attributes:
      - name: number
        type: integer
        description: The sequential ADR number (e.g. 9 for ADR-0009).
      - name: title
        type: string
        description: Short human-facing title of the decision.
    invariants:
      - id: adr-forward-looking
        statement: >-
          An `ADR` records a decision made before or during implementation —
          it is forward-looking, not a retrospective audit.

scenarios:
  - name: Author creates a model by conversation
    actors: [Author, Skill, Model, Entity, Attribute, Enum, GlossaryTerm, Linter, Schema]
    steps:
      - An `Author` describes concepts in plain language to a `Skill` (author).
      - The `Skill` drafts a `Model` with `Entity`s, `Enum`s, and
        `GlossaryTerm`s.
      - The `Author` reviews and refines; the `Skill` updates `Attribute`s and
        `Relationship`s.
      - The `Skill` runs the `Linter` against the `Model` using the `Schema`.
    invariants_touched:
      - model-has-version
      - entity-has-definition
      - attribute-type-resolves
      - linter-three-layers
      - schema-struct-sync
      - skill-shells-to-cli

  - name: Linter catches a dangling reference
    actors: [Author, Model, Relationship, Entity, Linter, LintFinding]
    steps:
      - An `Author` writes a `Relationship` whose target `Entity` is misspelled.
      - The `Linter` runs structural checks — the YAML parses.
      - The `Linter` runs semantic checks and finds the dangling target.
      - A `LintFinding` with `severity` = error and `layer` = semantic is
        produced; the linter exits non-zero.
    invariants_touched:
      - relationship-target-exists
      - finding-has-severity
      - linter-exit-code
      - linter-three-layers

  - name: Renderer produces a document
    actors: [Author, Model, Renderer, Document, Invariant, Scenario]
    steps:
      - An `Author` has a `Model` that passes lint with no errors.
      - The `Author` runs render; the `Renderer` generates a `Document` — a
        Markdown file with every `Entity`, `Invariant`, and `Scenario`, plus an
        embedded Mermaid `erDiagram`.
      - The `Author` commits the `Document` alongside the `Model`.
    invariants_touched:
      - renderer-output-matches-model
      - document-committed-with-model
      - lint-before-render

  - name: CI detects document drift
    actors: [Contributor, GitHubAction, Renderer, Document, Model]
    steps:
      - A `Contributor` edits only the `Model` and forgets to regenerate the
        `Document`.
      - The `GitHubAction` runs `render --check`, which regenerates the
        `Document` and compares it to the committed copy.
      - The check fails because the committed `Document` is stale.
      - The `Contributor` runs render and commits the regenerated `Document`;
        the check passes.
    invariants_touched:
      - document-never-hand-edited
      - renderer-output-matches-model
      - action-version-pinned

  - name: Model imports shared vocabulary from GitHub
    actors: [Author, Model, Import, Source, Attribute, Enum]
    steps:
      - An `Author` adds an `Import` declaration to a `Model`, pointing at a
        `Source` with a GitHub URL pinned to a tag.
      - The tool fetches the remote `Model` via `gh api` and vendors it into
        the target directory.
      - "Provenance headers are stamped into the vendored copy: the `Source`
        URL, the pinned ref, and a content digest."
      - A subsequent lint run resolves cross-model references (`scope.Name`)
        against the vendored `Import`.
    invariants_touched:
      - import-pinned-to-ref
      - import-has-provenance
      - source-host-unambiguous
      - fetch-timeout-bounded
      - attribute-type-resolves

  - name: Model imports shared vocabulary from Azure DevOps
    actors: [Author, Model, Import, Source, Attribute, Enum]
    steps:
      - An `Author` adds an `Import` declaration pointing at a `Source` with an
        Azure DevOps URL — a `_git` URL with `?path=...&version=GBmain`.
      - ParseSource extracts the Project, RefType (`branch`), and the
        repo path from the URL.
      - The tool fetches the remote `Model` via `az rest` and stamps provenance
        headers; the Ref is `main` and RefType is `branch`.
      - The `Author` passes `--ref v1.0.0` to override the ref; RefType
        resets to empty, and the API auto-detects the ref type.
    invariants_touched:
      - import-pinned-to-ref
      - import-has-provenance
      - source-host-unambiguous
      - source-ref-override-clears-ref-type
      - fetch-timeout-bounded
      - attribute-type-resolves

  - name: Example is a golden fixture
    actors: [Contributor, Example, Renderer, Document, Linter]
    steps:
      - A `Contributor` changes the `Renderer`'s output format.
      - The `Example`'s committed `Document` no longer matches the new output.
      - "`task render-check` and TestGoldenExample both fail — the golden
        fixture has drifted."
      - The `Contributor` regenerates the `Document` and commits it; both
        checks pass.
    invariants_touched:
      - example-lints-clean
      - example-md-is-golden
      - renderer-output-matches-model

  - name: Action preserves invariants
    actors: [Author, Action, Invariant, Entity, Linter]
    steps:
      - An `Author` defines an `Action` on an `Entity` with a `preserves` list
        referencing two `Invariant` ids.
      - The `Linter` checks that every id in the list resolves to a declared
        `Invariant`.
      - One id is misspelled; the `Linter` produces an error-level
        `LintFinding`.
      - The `Author` fixes the id; the check passes.
    invariants_touched:
      - action-preserves-resolves
      - action-actor-resolves
      - invariant-id-unique
      - relationship-not-both-owned

  - name: Schema evolves with a new version
    actors: [Contributor, Schema, Model]
    steps:
      - A `Contributor` adds a new feature to the format that requires a new
        `Schema` version.
      - A new directory `internal/schema/v2/` is created with the updated
        schema; the v1 `Schema` is untouched.
      - "`Model`s declaring `version: v1` continue to validate against v1;
        new `Model`s can opt into v2."
    invariants_touched:
      - schema-version-immutable
      - schema-struct-sync

  - name: A decision is recorded as an ADR
    actors: [Contributor, ADR]
    steps:
      - A `Contributor` makes a hard-to-reverse call — e.g. whether to support
        a new host for `Import`s.
      - An `ADR` is written in `project-docs/adr/` recording the context, the
        decision, and the rationale.
      - The `ADR` is committed alongside the code change it describes.
    invariants_touched:
      - adr-forward-looking

invariants:
  - id: lint-before-render
    statement: >-
      A `Model` that fails `Linter` structural checks cannot be rendered — the
      `Renderer` requires a structurally valid `Model`.

